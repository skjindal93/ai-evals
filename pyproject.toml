[project]
name = "ai-evals"
version = "0.1.0"
description = "AI Evals Platform - Run evals for AI agents across local, CI, and production"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.10",
    "typer>=0.15",
    "pyyaml>=6.0",
    "jsonschema>=4.23",
    "openai>=1.59",
    "langfuse>=2.57",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
]

[project.scripts]
ai-evals = "runner.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sdk", "runner"]

[tool.ruff]
line-length = 100
target-version = "py311"
